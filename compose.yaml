name: drawn
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: drawn
      POSTGRES_USER: drawn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U drawn -d drawn]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://drawn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker.local}@postgres:5432/drawn
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.docker.local}
      DATA_ROOT: /app/public/data
      MODEL_DIR: /app/backend/model_bundle
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
