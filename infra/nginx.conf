events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=prediction:10m rate=5r/s;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    upstream frontend { zone frontend 64k; server frontend:3000 resolve; }
    upstream api { zone api 64k; server api:8000 resolve; }

    server {
        listen 80;
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;

        location = /api/performance/predict {
            limit_req zone=prediction burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://api;
            proxy_buffering off;
        }
        location /api/ {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
        }
        location / {
            proxy_pass http://frontend;
        }
    }
}
