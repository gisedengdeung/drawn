<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Drawn animated drone logo">
  <style>
    .body { opacity: 0; transform-origin: 48px 48px; animation: body 1.35s ease-out both; }
    .arms { stroke-dasharray: 74; stroke-dashoffset: 74; animation: arms 1.35s ease-out both; }
    .props { opacity: 0; transform-origin: 48px 48px; animation: props 1.35s ease-out both; }
    .spark { opacity: 0; animation: spark 1.35s ease-out both; }
    @keyframes body { 0%,10% { opacity:0; transform:scale(.55) } 32%,100% { opacity:1; transform:scale(1) } }
    @keyframes arms { 0%,22% { stroke-dashoffset:74 } 58%,100% { stroke-dashoffset:0 } }
    @keyframes props { 0%,48% { opacity:0; transform:scale(.4) rotate(-40deg) } 68%,100% { opacity:1; transform:scale(1) rotate(0) } }
    @keyframes spark { 0%,43% { opacity:0 } 54%,72% { opacity:1 } 84%,100% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) { .body,.props { opacity:1; transform:none; animation:none } .arms { stroke-dashoffset:0; animation:none } .spark { opacity:0; animation:none } }
  </style>
  <rect width="96" height="96" rx="25" fill="#3182f6"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path class="arms" d="M37 42 25 34m34 8 12-8M37 54 25 62m34-8 12 8"/></g>
  <g class="body" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M48 34 60 41v14l-12 7-12-7V41l12-7Z"/></g>
  <g class="props" fill="#3182f6" stroke="#fff" stroke-width="4"><circle cx="20" cy="31" r="5"/><circle cx="76" cy="31" r="5"/><circle cx="20" cy="65" r="5"/><circle cx="76" cy="65" r="5"/></g>
  <circle class="spark" cx="48" cy="48" r="2.5" fill="#d7fbff"/>
</svg>
